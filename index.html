  <body>
    <header class="header-container">
      <div class="header-container__logo">
        <img
          class="header-container__logo-image"
          src="assets/images/brann_logo.svg"
          alt=""
        />
        <p class="header-container__title">BRANN</p>
      </div>
    </header>

    <main>
      <!-- First team squad introduction -->
      <section class="hero">
        <div class="hero__container">
          <p class="hero__eyebrow">SPORTSKLUBBEN BRANN</p>

          <h1 class="hero__title">A-LAGET</h1>

          <p class="hero__description">
            Møt spillerne som representerer Bergen.
          </p>

          <a class="hero__button" href="#squad"> Se spillerne </a>
        </div>
      </section>

      <section class="squad" id="squad">
        <div class="squad__container"></div>
      </section>

      <!-- Player Card Template, used as a template to generate player cards dynamically -->
      <template id="player-card-template">
        <div class="squad__player-card">
          <img class="squad__player-image" alt="" />

          <div class="squad__player-info-container">
            <p class="squad__player-name"></p>
            <p class="squad__player-position"></p>

            <div class="squad__player-nationality-container">
              <p class="squad__player-nationality"></p>
              <p class="squad__player-number"></p>
            </div>

            <p class="squad__player-birthdate"></p>
          </div>
        </div>
      </template>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="site-footer__container">
        <p class="site-footer__disclaimer">
          Dette nettstedet er et studentprosjekt laget for utdanningsformål. Det
          er ikke et offisielt nettsted og er ikke tilknyttet noen bedrift eller
          merkevare.

    </footer>

        },
      ];

      const squadContainer = document.querySelector(".squad__container");
      const template = document.querySelector("#player-card-template");

      for (const player of players) {
        const card = template.content.firstElementChild.cloneNode(true);

        const image = card.querySelector(".squad__player-image");
        image.src = player.image;
        image.alt = player.name;
        image.loading = "lazy";

        card.querySelector(".squad__player-name").textContent = player.name;
        card.querySelector(".squad__player-position").textContent =
          player.position;
        card.querySelector(".squad__player-nationality").textContent =
          player.nationality;
        card.querySelector(".squad__player-birthdate").textContent =
          player.birthdate;
        const number = card.querySelector(".squad__player-number");

        if (player.number !== null) {
          number.textContent = `#${player.number}`;
        } else {
          number.remove();
        }

        squadContainer.appendChild(card);
      }
