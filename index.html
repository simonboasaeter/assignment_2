<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header-container">
      <div class="header-container__logo">
        <img
          class="header-container__logo-image"
          src="assets/images/brann_logo.svg"
          alt=""
        />
        <p class="header-container__title">BRANN</p>
      </div>
    </header>

    <main>
      <!-- First team squad introduction -->
      <section class="hero">
        <div class="hero__container">
          <p class="hero__eyebrow">SPORTSKLUBBEN BRANN</p>

          <h1 class="hero__title">A-LAGET</h1>

          <p class="hero__description">
            Møt spillerne som representerer Bergen.
          </p>

          <a class="hero__button" href="#squad"> Se spillerne </a>
        </div>
      </section>

      <section class="squad">
        <div class="squad__container">
          <div class="squad__player-card">
            <img
              src="assets/images//players/defenders/fredrik_pallesen.png"
              alt="Fredrik Pallesen"
              class="squad__player-image"
            />
            <div class="squad__player-info-container">
              <p class="squad__player-name">Fredrik Pallesen</p>
              <p class="squad__player-position">Forsvarsspiller</p>

              <div class="squad__player-nationality-container">
                <p class="squad__player-nationality">NOR</p>
                <p class="squad__player-number">#4</p>
              </div>

              <p class="squad__player-birthdate">7 Oktober 1995</p>
              <p class="squad__player-height">1.84 m</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
